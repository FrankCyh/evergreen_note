lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Dan Meyer</h1></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zBpEx9YRNeGS6hSuE1ajWMd":{"data":{"slug":"zBpEx9YRNeGS6hSuE1ajWMd","title":"Dan Meyer","contentMarkdown":"# Dan Meyer\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"The joy of being the cause","linkingNoteSlug":"zMjcNef7C6YF1rMwdiT3Vyd","contextBlocks":["[[zBpEx9YRNeGS6hSuE1ajWMd:::Dan Meyer]] - [Learning the Wrong Lessons from Video Games](https://blog.mrmeyer.com/2018/learning-the-wrong-lessons-from-video-games/?utm_source=substack\u0026utm_medium=email) (2018)"],"hidden":true},{"linkingNoteTitle":"Desmos","linkingNoteSlug":"zB6pvWqVfwdGBZn63hfkXnZ","contextBlocks":["Curriculum portion of the business (including [[zBpEx9YRNeGS6hSuE1ajWMd:::Dan Meyer]]) acquired in May 2022 by Amplify. The calculator will spin off as a separate PBC (“Desmos Studio”) led by Eli Luberoff."],"hidden":true},{"linkingNoteTitle":"Smith, M. S., \u0026 Stein, M. K. (2018). 5 Practices for Orchestrating Productive Mathematics Discussion (2nd ed). National Council of Teachers of Mathematics.","linkingNoteSlug":"zPgdMsirRvAKk3PKzBZN5c1","contextBlocks":["Illustration videos, via [[zBpEx9YRNeGS6hSuE1ajWMd:::Dan Meyer]]: \u003chttps://us.corwin.com/en-us/nam/the-five-practices-in-practice/book260532\u003e"],"hidden":true},{"linkingNoteTitle":"Programmed instruction","linkingNoteSlug":"zJnwHfze71uA7T6pUwfe36f","contextBlocks":["Rutherford (2003), on Benjamin (1988): “He suggested instead that cultural inertia, resistance to technology, or “simply old-fashioned resistance to change” (p. 711) contributed to the machine’s failure to thrive. He also noted the general failure of educational technologies (the teaching machine among them) that appear to invalidate the student-teacher bond — a bond that has traditionally been seen as an essential ingredient in the learning process.” On that latter point, see also [[zBpEx9YRNeGS6hSuE1ajWMd:::Dan Meyer]]’s comments on [[zd4676MfH9HmGKhuneoHTZ:::GPT-4]] in education; e.g. [It’s Pretty Clear That These Math Students Aren’t Interested in Learning From an AI Chatbot Tutor](https://danmeyer.substack.com/p/its-pretty-clear-that-these-math): “I can just say, as simply and emphatically as possible, that when K-12 students are in a classroom with other humans trying to learn mathematics, the majority of them do not wish to have a conversation with their computer. They wish to have conversations with the other humans. They do not wish to be complimented and seen as smart and successful by their computer. They wish to be complimented and seen as smart and successful by the humans in whom they have invested their social capital”."],"hidden":true},{"linkingNoteTitle":"2024-05 Talk at UCSD - Problems","linkingNoteSlug":"z5rHGSoDQujZvNp511X7jp1","contextBlocks":["relies on user to initiate everything, contra [[zBpEx9YRNeGS6hSuE1ajWMd:::Dan Meyer]] call for pushiness"],"hidden":true},{"linkingNoteTitle":"It Isn't Enough to Love Kids or Math - Dan Meyer","linkingNoteSlug":"It Isn't Enough to Love Kids or Math - Dan Meyer","contextBlocks":["# It Isn't Enough to Love Kids or Math - [[zBpEx9YRNeGS6hSuE1ajWMd:::Dan Meyer]]"],"hidden":true},{"linkingNoteTitle":"Kirschner, P. A., Sweller, J., \u0026 Clark, R. E. (2006). Why Minimal Guidance During Instruction Does Not Work: An Analysis of the Failure of Constructivist, Discovery, Problem-Based, Experiential, and Inquiry-Based Teaching. Educational Psychologist, 41(2), 75–86","linkingNoteSlug":"zUiDqjKiS3udc3wcvcFbcpc","contextBlocks":["I think this objection is actually quite important, though I view it as complementary to KSC’s concerns. Reminds me a lot of [[zBpEx9YRNeGS6hSuE1ajWMd:::Dan Meyer]]’s arguments."],"hidden":true}],"linkedNoteSlugs":[],"ctimeMillis":1753115539526.032,"mtimeMillis":1689272781347.282}}}}},"page":"/[note]","query":{"note":"zBpEx9YRNeGS6hSuE1ajWMd"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest.js" async=""></script></body></html>
