lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>John Anderson</h1><p>Pioneer of <a href="/zBy91z6f7RW6wn8iagJyCqG" class="jsx-1555031696 "><span>Intelligent tutoring system</span></a>.</p></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zFNsXgqNKRmNCM1J9FBeGFP":{"data":{"slug":"zFNsXgqNKRmNCM1J9FBeGFP","title":"John Anderson","contentMarkdown":"# John Anderson\n\nPioneer of [[zBy91z6f7RW6wn8iagJyCqG:::Intelligent tutoring system]].\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Intelligent tutoring system","linkingNoteSlug":"zBy91z6f7RW6wn8iagJyCqG","contextBlocks":["[[zQVrSw6FWAKUCee81YaaZjY:::Cognitive Tutor]] systems (LISP Tutor, Geometry Tutor, MathIA, etc)—[[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]]’s branch of the tree"],"hidden":true},{"linkingNoteTitle":"Situated learning","linkingNoteSlug":"zL7XdosCZ9qeCSSCrhcYfwY","contextBlocks":["[[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]] / Reder / [[z2khQEBddUwRBv2hXGqNzBq:::Herb Simon]] anti-situationist/[[zWceTLNTjH3DQ7iVpy38ocq:::Constructivism]] flame war:"],"hidden":true},{"linkingNoteTitle":"DARPA Digital Tutor","linkingNoteSlug":"zWAqJu2TEbirNZznpyn8ijJ","contextBlocks":["There are zero citations of [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]] or his Cognitive Tutors, but the Digital Tutor seems to follow similar lines of formal student modeling: “The Tutor relies on a back-end that involves classic knowledge engineering—feature extraction, ontologies, and inferencing. The Inference Engine captures problem-solving processes—the strategy and path each learner is using to solve problems based on what the learner understands or misunderstands.”"],"hidden":true},{"linkingNoteTitle":"AutoTutor","linkingNoteSlug":"z3iR6PS6S8PMjJ9i2Xj9on5","contextBlocks":["A family of natural dialogue-based [[zBy91z6f7RW6wn8iagJyCqG:::Intelligent tutoring system]] initially developed by Arthur Graessler but later expanded into many variations by other researchers. These systems frame their ambition as attempting to simulate a human tutor; the initial designs were created to imitate conversational forms and moves observed in a pool of human tutors. Unlike [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]]’s systems, which emphasize problem-solving, these dialogues mostly focus on explanation, implication, inference, and so on."],"hidden":true},{"linkingNoteTitle":"Cognitive Tutor","linkingNoteSlug":"zQVrSw6FWAKUCee81YaaZjY","contextBlocks":["[[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]]’s approach to [[zBy91z6f7RW6wn8iagJyCqG:::Intelligent tutoring system]], which involve [[zRNMBFaUqDQCAnX9LKYzm85:::ACT-R]]-inspired modeling of the student’s live production rules. See [[zBy91z6f7RW6wn8iagJyCqG:::Intelligent tutoring system]] for more."],"hidden":true},{"linkingNoteTitle":"Anderson, J. R., Boyle, C. F., \u0026 Reiser, B. J. (1985). Intelligent Tutoring Systems. Science, 228(4698), 456–462","linkingNoteSlug":"zJVYdtDqVvFbBDaF1fbW5ZT","contextBlocks":["By [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]] and colleagues, summarizing early work on [[zBy91z6f7RW6wn8iagJyCqG:::Intelligent tutoring system]] in Science."],"hidden":true},{"linkingNoteTitle":"Anderson, J. R., Reder, L. M., \u0026 Simon, H. A. (1996). Situated Learning and Education. Educational Researcher, 25(4), 5–11","linkingNoteSlug":"zNwHYafJejVD1CBXNDSLqFS","contextBlocks":["Criticism of [[zL7XdosCZ9qeCSSCrhcYfwY:::Situated learning]] and in particular [[zMhuu3pPa6FeNGYn3VfGCar:::Situated Learning - Lave and Wenger]], from [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]], Reder, and [[z2khQEBddUwRBv2hXGqNzBq:::Herb Simon]]."],"hidden":true},{"linkingNoteTitle":"ACT-R","linkingNoteSlug":"zRNMBFaUqDQCAnX9LKYzm85","contextBlocks":["Theory of cognition per [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]]."],"hidden":true},{"linkingNoteTitle":"Idea-centric memory system","linkingNoteSlug":"z7wCFe7MP9VeCVApcBLC7SN","contextBlocks":["A goofy observation: [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]]’s ACT-R models condition in terms of production rules. “If I see two intersecting lines where I know the angle here and I’m trying to find the angle there, I can do X.” They’re quite rote. I’ve been thinking recently that they’re probably the wrong level of abstraction, at least for the instructional designer. It seems unrealistic to imagine that we’re going to model hundreds of production rules for every subject. And possibly quite rigid too. Better, perhaps, to develop some way to infer them from a higher-level definition. FORTRAN for production rules. I’m sure there’s been a lot of work done like that in the [[zBy91z6f7RW6wn8iagJyCqG:::Intelligent tutoring system]] space; I’m not well-read in the research there."],"hidden":true},{"linkingNoteTitle":"Anderson, J. R., Reder, L. M., Simon, H. A., Ericsson, K. A., \u0026 Glaser, R. (1998). Radical Constructivism and Cognitive Psychology. Brookings Papers on Education Policy, 1, 227–278","linkingNoteSlug":"zGUDT5KyGRkfacvBktdXj26","contextBlocks":["[[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]], Reder, and [[z2khQEBddUwRBv2hXGqNzBq:::Herb Simon]] criticize strong forms of [[zWceTLNTjH3DQ7iVpy38ocq:::Constructivism]], which insist that it’s not possible to reason systematically about the representations in a learner’s head, that understandings must formed by the student without explicit guidance, that learning should happen in authentic, social situations, driven by students’ free choices."],"hidden":true},{"linkingNoteTitle":"Anderson, J. R., Reder, L. M., \u0026 Simon, H. A. (1995). Applications and Misapplications of Cognitive Psychology to Mathematics Education","linkingNoteSlug":"zNYimPwCAD9FtQV6DTLj377","contextBlocks":["Criticism by [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]], Reder, and [[z2khQEBddUwRBv2hXGqNzBq:::Herb Simon]] of [[zWceTLNTjH3DQ7iVpy38ocq:::Constructivism]] and [[zL7XdosCZ9qeCSSCrhcYfwY:::Situated learning]]."],"hidden":true},{"linkingNoteTitle":"Anderson, J. R., \u0026 Schunn, C. D. (2000). Implications of the ACT-R Learning Theory: No Magic Bullets. In R. Glaser (Ed.), Advances in instructional psychology (Vol. 5). Erlbaum","linkingNoteSlug":"zARS7ixzXqcRupCJhXHoV6X","contextBlocks":["[[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]] and Christian Schuss examine some of the implications of [[zRNMBFaUqDQCAnX9LKYzm85:::ACT-R]] for learning. Some of the key claims include:"],"hidden":true},{"linkingNoteTitle":"Chi, M. T. H., Bassok, M., Lewis, M. W., Reimann, P., \u0026 Glaser, R. (1989). Self-explanations: How students study and use examples in learning to solve problems. Cognitive Science, 13(2), 145–182","linkingNoteSlug":"zEM6D2693bMZcQHJTozqn87","contextBlocks":["Q. How do the authors’ assumptions about bottlenecks in learning processes differ from [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]]’s?"],"hidden":true},{"linkingNoteTitle":"Pardos, Z. A., Tang, M., Anastasopoulos, I., Sheel, S. K., \u0026 Zhang, E. (2023). OATutor: An Open-source Adaptive Tutoring System and Curated Content Library for Learning Sciences Research. Proceedings of the 2023 CHI Conference on Human Factors in Computing Systems, 1–17","linkingNoteSlug":"z6baPVwxrEvANeZytRiLTXE","contextBlocks":["I find [[zRNMBFaUqDQCAnX9LKYzm85:::ACT-R]] incredibly tantalizing, intellectually. And I admire how [[zFNsXgqNKRmNCM1J9FBeGFP:::John Anderson]]’s [[zQVrSw6FWAKUCee81YaaZjY:::Cognitive Tutor]]s take cognitive architecture seriously in a way that more simplistic KA-style exercises don’t. I’m very interested in JRA’s anecdotes about the tutors being so beloved that the cause disciplinary problems. But I *hate* using this ITS, in much the way I’d imagined I might given my read of the prior papers."],"hidden":true}],"linkedNoteSlugs":["zBy91z6f7RW6wn8iagJyCqG"],"ctimeMillis":1753115539637.1113,"mtimeMillis":1689272956082.652}}}}},"page":"/[note]","query":{"note":"zFNsXgqNKRmNCM1J9FBeGFP"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest.js" async=""></script></body></html>
