lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Nate Soares</h1><p>Rationalist writer. Author of the “Replacing Guilt” blog series.</p></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"Nate_Soares":{"data":{"slug":"Nate_Soares","title":"Nate Soares","contentMarkdown":"# Nate Soares\n\nRationalist writer. Author of the “Replacing Guilt” blog series.\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Rationalist","linkingNoteSlug":"z5mmLbwPhvLXnuoLDrsW91T","contextBlocks":["[[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]"],"hidden":true},{"linkingNoteTitle":"Beware a sense of “should”","linkingNoteSlug":"zAVYsmfhTamrvmGdTpXgUvk","contextBlocks":["[[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] - [“Should” considered harmful](https://mindingourway.com/should-considered-harmful/)"],"hidden":true},{"linkingNoteTitle":"Stop trying to try and try, after Soares","linkingNoteSlug":"zQTBAGqGvVQVvRntB69GNPi","contextBlocks":["One nice metaphor [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] uses: soccer players often sprint many miles in the coarse of a game, but they have a much easier time doing that than a person who explicitly tries to sprint several miles. That person’s focused on a goal which seems much harder than “play this fun game”; they’re constantly pushing against internal forces which suggest they stop.","Q. What does it feel like to “actually try” to do something hard, vs. “trying to try,” per [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]?","Q. What vivid example does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] use of how to background your Big Important Problem so that you can “actually try”?","Q. What unusual interpretation does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] have of Yoda’s “there is no try” advice?","Q. Why does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] suggest “cashing out your ‘try’s”, expressing in more detail what you’re *doing* instead of what you’re *trying* to do?"],"hidden":true},{"linkingNoteTitle":"Replacing Guilt - Soares","linkingNoteSlug":"z2EeBFS91iTHhSkdmXqhTns","contextBlocks":["Series of [[z5mmLbwPhvLXnuoLDrsW91T:::Rationalist]] blog posts by [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] about [[zKAXykV6vxcnSNEpT2LfyWG:::Non-coercive productivity]].","Q. What counter-intuitive claim does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] make about rest states?","Q. What are the three tools of guilt refinement that [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] introduces?","Q. What is [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]’s *refinement* tool for shifting guilt?","Q. What is [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]’s *internalization* tool for shifting guilt?","Q. What is [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]’s *realism* tool for shifting guilt?","Q. What does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] see as the goal of shifting guilts (rather than just dropping them)?","[[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]: If you find yourself regularly experiencing guilt, then {you’re using guilt incorrectly} [i.e. because {guilt is costly and demotivating; it’s useful as a threat, not an everyday action}]","Q. Rather than feeling guilty when you act against your own will, what does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] recommend?","[[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]: If you worry that, by removing guilt, you will lose your ability to update when you mess up, then I say: {update on the suckerpunch}.","Q. What’s the significance of [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]]’s phrase “update on the sucker punch”?","Q. What key strategy does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] offer for [self-compassion](https://mindingourway.com/self-compassion/)?","Q. What does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] mean by “tolerification”?","Q. What does [[z4U4Gf7qpeMHxSMfjVRBXDG:::Nate Soares]] suggest one should do about tolerification?"],"hidden":true}],"linkedNoteSlugs":[],"ctimeMillis":1753115539698.7488,"mtimeMillis":1689273171385.659}}}}},"page":"/[note]","query":{"note":"Nate_Soares"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest.js" async=""></script></body></html>
