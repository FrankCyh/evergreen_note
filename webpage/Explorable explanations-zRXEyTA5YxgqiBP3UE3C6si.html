lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Explorable explanations</h1><h2>Creators</h2><ul><li><a href="/Bret_Victor" class="jsx-1555031696 "><span>Bret Victor</span></a></li><li><a href="/zHKy5xhvTYvKNrmQ1CyS1oQ" class="jsx-1555031696 "><span>Nicky Case</span></a></li><li><a href="/zPGyDRQqrxGTdfw7jvPtdck" class="jsx-1555031696 "><span>Chaim Gingold</span></a></li><li><a href="/zHa69gUkq82eCjNPjWx3FNj" class="jsx-1555031696 "><span>Bartosz Ciechanowski</span></a></li><li><a href="/zWy4kCZkWZFxRYjW7fi6Egw" class="jsx-1555031696 "><span>Grant Sanderson</span></a></li></ul></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zRXEyTA5YxgqiBP3UE3C6si":{"data":{"slug":"zRXEyTA5YxgqiBP3UE3C6si","title":"Explorable explanations","contentMarkdown":"# Explorable explanations\n\n## Creators\n\n*   [[Bret Victor]]\n*   [[zHKy5xhvTYvKNrmQ1CyS1oQ:::Nicky Case]]\n*   [[zPGyDRQqrxGTdfw7jvPtdck:::Chaim Gingold]]\n*   [[zHa69gUkq82eCjNPjWx3FNj:::Bartosz Ciechanowski]]\n*   [[zWy4kCZkWZFxRYjW7fi6Egw:::Grant Sanderson]]\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Synthesis Tutor","linkingNoteSlug":"zN24T3P8FH7F73F6gBy4XCM","contextBlocks":["This is roughly a [[zHoGHbBLzkpLBH7jWNkr4dq:::Narrated explorable]]: there’s a [[zHYYdRPrLvyWy4xxXpNn4kE:::Dynamic medium]] representing the mathematical concept, shared by author and by reader, presented within an authored narrative. Unlike most [[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]], the script behaves and responds (very minimally) to reader action, roughly on the level of most of [[zHKy5xhvTYvKNrmQ1CyS1oQ:::Nicky Case]]’s projects.","Classic CAI systems also embedded instruction into exercises and dynamic representations, but (like most [[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]]) this system emphasizes exploration and discovery with the representation, rather than immediately jumping to formality as most classic systems do."],"hidden":true},{"linkingNoteTitle":"How might we situate tools for thought within intrinsically meaningful contexts?","linkingNoteSlug":"zGD1FxbDZd7WnH7NrhRaVyC","contextBlocks":["[[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]] and the [[zKPv6qkSErdRGqyryvgS2wS:::Mnemonic medium]] are cool, but interactive articles and spaced repetition practice are miles away from where the actual meaning is. [[z7d63BYfJrd81VFE25jkcDd:::Enabling environments focus on creating opportunities for growth and action, not on skill-building]]. How might we adapt these types of powerful tools so that they can be situated within deeply meaningful interactions?"],"hidden":true},{"linkingNoteTitle":"Anti-marketing, after Michael Nielsen","linkingNoteSlug":"zF9ywLHqHfN5rFuPApiyqmP","contextBlocks":["Related is [[Bret Victor]]’s term “anti-rhetoric”, as used [here](https://dynamicland.org/archive/2016/Transactional_interpretations) in an excerpted email to [[zHKy5xhvTYvKNrmQ1CyS1oQ:::Nicky Case]] about [[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]]."],"hidden":true},{"linkingNoteTitle":"We lack UI patterns for linked representations for arrangements on a 2D canvas","linkingNoteSlug":"zXo7vt8C47Wj8Wh2ZNfozZ","contextBlocks":["[[zTTKcEY5M9mb8Gc1yovh6wM:::Linked representations]] are an essential design pattern of the [[zHYYdRPrLvyWy4xxXpNn4kE:::Dynamic medium]]. [[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]] often link representations between multiple figures; tools like Descript link audio and textual representations; [[zVLVGffrkZiYmahXqFPQtP4:::Transclusion]] links text when simultaneously presented in several contexts. Tools like these let us make sense of information by moving interactively between several ways of presenting the same content, or between several levels of abstraction (see e.g. [[zT6QcspwtJ55KAasV5jHwjJ:::Up and Down the Ladder of Abstraction - Bret Victor]]). But we lack good linking patterns when one of the representations is an arrangement on a 2D canvas, e.g. in [[zF6yhcVZ2yT7xpRQTWBzstB:::Figma]]."],"hidden":true},{"linkingNoteTitle":"Most dynamic representations developed for communication aren’t very enabling","linkingNoteSlug":"zU6upTVz687icnQegpMhLY8","contextBlocks":["Interactive diagrams and small embedded sandbox simulations in [[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]] may help the author get their point across, but they’re rarely useful as independent environments for the reader to think in. These elements’ main purpose is to help the reader more effectively understand the point the author wants to make.","I think this is part of why [[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]] and similar media don’t seem to add up to creating an [[z492hGrHvRvJiEY9UfB4Mby:::Enabling environment]] for readers, even though dozens have now been created. They’re striking, they’re often more *interesting* to read than normal articles, and the dynamic elements  often make it easier to understand the author, but one doesn’t walk away from the article with the dynamic environment in one’s pocket, so to speak."],"hidden":true},{"linkingNoteTitle":"Narrated explorable","linkingNoteSlug":"zHoGHbBLzkpLBH7jWNkr4dq","contextBlocks":["Term I’ve used to describe media akin to [[zRXEyTA5YxgqiBP3UE3C6si:::Explorable explanations]] but which integrate the narrative experience into the interactive environment, instead of separating them as is usually done."],"hidden":true}],"linkedNoteSlugs":["Bret Victor","zHKy5xhvTYvKNrmQ1CyS1oQ","zPGyDRQqrxGTdfw7jvPtdck","zHa69gUkq82eCjNPjWx3FNj","zWy4kCZkWZFxRYjW7fi6Egw"],"ctimeMillis":1753115539566.6196,"mtimeMillis":1689273098179.823}}}}},"page":"/[note]","query":{"note":"zRXEyTA5YxgqiBP3UE3C6si"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><scri
