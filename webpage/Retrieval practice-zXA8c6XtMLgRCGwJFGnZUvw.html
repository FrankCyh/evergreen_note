lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Retrieval practice</h1><p>Learning activity designed to produce the <a href="/zTpJdbe6ub7uhBFLuHkFsrT" class="jsx-1555031696 "><span>Testing effect</span></a>.</p></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zXA8c6XtMLgRCGwJFGnZUvw":{"data":{"slug":"zXA8c6XtMLgRCGwJFGnZUvw","title":"Retrieval practice","contentMarkdown":"# Retrieval practice\n\nLearning activity designed to produce the [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]].\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Retrieval practice and transfer learning","linkingNoteSlug":"zRTw8KaPErhSCyC2NYGHyP7","contextBlocks":["in this broader systematic review of [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], the authors note that “Effect sizes were generally smaller for experiments with rephrased questions compared to experiments with verbatim or repeated questions.” The effect looks smallish—perhaps d~0.1-0.2.","[[zCtk2teEZ9Rcu25hx6TEJuh:::Interleaved practice]], which in this instance would involve both [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] and the [[z4KScVkQCD2XmVwvSDUbZtn:::Spacing effect]], produces markedly improved results on a delayed transfer test.","Study primarily designed to assess [[z2crTaHNqd6APCtmzXk7x6W:::Concept mapping]] vs. [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], but assessment involves inference questions requiring transfer; on these questions, students in the retrieval practice condition performed better than all other conditions (repeated studying, concept mapping), and fairly well in absolute terms."],"hidden":true},{"linkingNoteTitle":"Worked example effect","linkingNoteSlug":"zD8D8PPRBDEFk3JeM2vaWrn","contextBlocks":["While the term “worked example effect” usually refers to comparisons of studying related worked examples to solving related problems, it’s sometimes discussed in comparison to the [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]]—i.e. is it better to study related worked examples, or to engage in [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] by re-solving related problems? See e.g. Yeo and Fazio, 2019. [[z6d4D1bSzhdaGpnAKGBX3FT:::Jeffrey Karpicke]] argues (see commentary on [[zMjGz9ddgwjxadBRxQCnnWY:::van Gog, T., \u0026 Sweller, J. (2015). Not New, but Nearly Forgotten: The Testing Effect Decreases or even Disappears as the Complexity of Learning Materials Increases. Educational Psychology Review, 27(2), 247–264]]) that “the worked-example experiments all failed to show retrieval practice effects because of the way retrieval practice was implemented” (i.e. immediate, massed, “requiring no episodic context reinstatement”)."],"hidden":true},{"linkingNoteTitle":"Henry L. Roediger","linkingNoteSlug":"zTDVHBLRk1LKQ6G6bFHFoVZ","contextBlocks":["Experimental cognitive psychologist. His research often investigates [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]]."],"hidden":true},{"linkingNoteTitle":"Implicit retrieval practice","linkingNoteSlug":"zQGck6tJtxXKa79HWtsV9LT","contextBlocks":["[[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] which occurs implicitly in the course of other, possibly more authentic activities. Unclear whether and in what scenarios this has the same effect as explicit retrieval practice."],"hidden":true},{"linkingNoteTitle":"Transfer-appropriate processing","linkingNoteSlug":"z6TYDg3hS2xeHNjpQdNHxss","contextBlocks":["But then: who cares? The test isn’t what matters. Authentic performance is what matters. So, if we’re looking at [[z7ffiDfqTR9pPcEEUUbCL7C:::Transfer learning]] results, in authentic settings, do we see better results with heterogenous [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] formats? And are those better results worth the experience / authorship costs of multiple choice? e.g. see [[zTdvNo5ScxFo88ECREkzNjA:::Self-graded spaced repetition memory systems are more efficient than machine-graded systems]]"],"hidden":true},{"linkingNoteTitle":"Self-explanation effect","linkingNoteSlug":"zF9BD4B7W9MaknXXn3Uhvox","contextBlocks":["Presumably related to [[z26C6ing3sqiZMHRVFuT6xn:::Generation effect]], [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], and [[z9Uq4yzBT1QaBU8twwyvm7P:::Elaborative encoding]]."],"hidden":true},{"linkingNoteTitle":"van Gog, T., Kester, L., Dirkx, K., Hoogerheide, V., Boerboom, J., \u0026 Verkoeijen, P. P. J. L. (2015). Testing After Worked Example Study Does Not Enhance Delayed Problem-Solving Performance Compared to Restudy. Educational Psychology Review, 27(2), 265–289","linkingNoteSlug":"zACCVs7DZQCm7H4txDJD134","contextBlocks":["For high [[zBk3AaWYp4spoTbc1f5aYvC:::Element interactivity]] material (modestly complex problem solving), the authors fail to find a [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]] and instead find a [[zD8D8PPRBDEFk3JeM2vaWrn:::Worked example effect]]: restudying isomorphic worked examples leads to better results on final test performance. This holds both when the [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] involves solving isomorphic/identical problems and also when it involves simply recalling the text of the example solution."],"hidden":true},{"linkingNoteTitle":"Memory system practice sessions are too disconnected from activities you actually care about","linkingNoteSlug":"zEmEnm29YT9Lp4mnWzPVQZJ","contextBlocks":["[[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] in a [[z2D1qPwddPktBjpNuwYFVva:::Spaced repetition memory system]] often feels so abstract: trying to remember a bunch of material from various books and papers you read in the past, all jumbled, in the form of questions you’ve answered before, in an artificial environment. Generously, perhaps, it’s a kind of [[Deliberate practice, after Ericsson]], but it often feels like a chore in part because it’s not *doing the thing*, and the practice session’s emotional connection with *doing the thing* is weak."],"hidden":true},{"linkingNoteTitle":"Concept mapping","linkingNoteSlug":"z2crTaHNqd6APCtmzXk7x6W","contextBlocks":["concept mapping for [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] doesn’t produce a larger [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]] than writing recalled info"],"hidden":true},{"linkingNoteTitle":"Pre-testing effect","linkingNoteSlug":"zCaVdAEo3YDwAbuxLeW9JZ7","contextBlocks":["Taking practice tests *before* information has been learned may cause improved learning performance. Presumably this occurs through a different mechanism than [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] / [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]].","The [[zSoTbuyrXFnDHibaSeEzPRx:::Adjunct questions]] literature explored this before the [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] literature, so there’s some discussion here: [[z4m9Gat7zi9YUmZzQRR7pwt:::Adjunct questions improve comprehension of related but untested content]]."],"hidden":true},{"linkingNoteTitle":"Prefer “memory system” to “spaced repetition system”","linkingNoteSlug":"zKa9YkyLmK8ynFKCWZBDBpk","contextBlocks":["[[Michael Nielsen]] points out (e.g. in [[z6yDMhNY6M7tp6UtnRBhe6G:::How to make memory systems widespread? - Michael Nielsen]]) that [[z2D1qPwddPktBjpNuwYFVva:::Spaced repetition memory system]] inappropriately emphasizes one specific mechanism. The exciting prospect is for memory systems (and, indeed, *practice* systems—[[zUdBBp4QwMGcUujgfbyBZcC:::Perhaps “practice systems”, not “memory systems”]]) in general. Spaced repetition is one idea (well—really—several) of many which will be important in creating powerful such systems. For example, different methods of encoding of ideas into [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] prompts likely have more impact than details of spacing. The feeling of the [[zKPv6qkSErdRGqyryvgS2wS:::Mnemonic medium]] is substantially defined by initial review—[[zTzb8spnoqzxs3mkvPKprmn:::Mnemonic medium prompts are interleaved into the reading experience]] (i.e. no spacing, no repetition!)."],"hidden":true},{"linkingNoteTitle":"Retry intervention produces substantial increases in early accuracy on Quantum Country","linkingNoteSlug":"znurZMV9VHDcEWD9TMTM1a","contextBlocks":["In essence, the mechanism creates an opportunity for extra [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] when you’re relatively likely to successfully recall the answer (i.e. because you were just shown the correct answer a few minutes earlier). The [[z4KScVkQCD2XmVwvSDUbZtn:::Spacing effect]] suggests that it might be even better to retry later—perhaps half a day or a day. But waiting until the next review session is too long for effective [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], since you’ve probably forgotten the correct answer by then, and since (it seems) retrieval practice is less effective when the correct answer is not recalled.","In essence, the mechanism creates an opportunity for extra [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] when you’re relatively likely to successfully recall the answer (i.e. because you were just shown the correct answer a few minutes earlier). The [[z4KScVkQCD2XmVwvSDUbZtn:::Spacing effect]] suggests that it might be even better to retry later—perhaps half a day or a day. But waiting until the next review session is too long for effective [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], since you’ve probably forgotten the correct answer by then, and since (it seems) retrieval practice is less effective when the correct answer is not recalled."],"hidden":true},{"linkingNoteTitle":"Idea-centric memory system","linkingNoteSlug":"z7wCFe7MP9VeCVApcBLC7SN","contextBlocks":["In a [[z2D1qPwddPktBjpNuwYFVva:::Spaced repetition memory system]], the central noun is the prompt—a task constructed to promote [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] or to produce the [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]]. But I’m interested in exploring an alternative formulation in which *ideas* are the core noun, or at least exist alongside prompts. To put this another way: to put something into a memory system right now, you encode it into prompts and tasks. What if, instead, you could put *the thing itself* into the memory system? And then, when you show up for your daily review sessions, you’d be presented with activities which reinforce and deepen those things?"],"hidden":true},{"linkingNoteTitle":"Elaborative verbal rehearsal","linkingNoteSlug":"zUR6RM21Sa88cFDfC47svVv","contextBlocks":["[[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]]"],"hidden":true},{"linkingNoteTitle":"Tekin, E., \u0026 Roediger, H. L. (2021). The effect of delayed judgments of learning on retention. Metacognition and Learning.","linkingNoteSlug":"zTdKd8YdaLP9XWmRUWcCfBN","contextBlocks":["These experiments compare the effects of delayed [[z4uqS1yRWtoe1hE5xuyFSfA:::Judgment of learning]] and [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] on recall, both to evaluate the impact of the former and to evaluate potential mechanisms."],"hidden":true},{"linkingNoteTitle":"Quantum Country’s high recall accuracy rates may mask forgetting because of cuing","linkingNoteSlug":"zCPVuBdM14VLAHivMDGY7FB","contextBlocks":["I know that there’s some empirical literature testing [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] in “free” vs. cued contexts; I should review that literature to see what’s known here."],"hidden":true},{"linkingNoteTitle":"Some activities (piano, cooking) offer a situated venue for targeted practice activities","linkingNoteSlug":"zM1anD1xFyk5aMFM6VXUjUE","contextBlocks":["One problem for [[zL7XdosCZ9qeCSSCrhcYfwY:::Situated learning]] is that for many types of learning, I think [[zCyoCsqj8ZNUR7vfYKVCUu7:::Cognitivism]] is right: effective learning does in fact require that attention be paid to the realities of working memory, long-term memory, depth of processing, and fluency. Unfortunately, the standard ways to achieve that (e.g. [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], [[zTkRoDEXnMQqwb6uDxyA8Us:::Deliberate practice]]) are usually decontextualized and hence non-authentic or “illegitimate”."],"hidden":true},{"linkingNoteTitle":"Blunt, J. R., \u0026 Karpicke, J. D. (2014). Learning with retrieval-based concept mapping. Journal of Educational Psychology, 106(3), 849–858","linkingNoteSlug":"zKDWDVyZ7kBQLnq6Fq5KSj6","contextBlocks":["Finding: [[z2crTaHNqd6APCtmzXk7x6W:::Concept mapping]] for [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] doesn’t produce a larger [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]] than writing explanations."],"hidden":true},{"linkingNoteTitle":"Salience prompts","linkingNoteSlug":"zF8pCkzLVarNsaFyBxF9Aib","contextBlocks":["This is in some sense an implicit retrieval task. It’s not clear if [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] makes it more likely. My instinct is that it does… but what kinds of practice work best? What schedule is most appropriate? [[zxcWAKafDjKB3GTNi39Dkz:::How to experimentally characterize salience prompts?]]"],"hidden":true},{"linkingNoteTitle":"Agarwal, P. K., Finley, J. R., Rose, N. S., \u0026 Roediger, H. L. (2017). Benefits from retrieval practice are greater for students with lower working memory capacity. Memory, 25(6), 764–771","linkingNoteSlug":"zRWFTbAvXoJTcRYxrhJoHBw","contextBlocks":["166 college students engage in a relatively standard three-phase [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] study design, varying the second phase (re-study vs. test), retention interval (10 minutes, 2 days), and feedback (present, absent). Before phase two, students completed a working memory span test. Material studied was general knowledge trivia."],"hidden":true},{"linkingNoteTitle":"Make it Stick - Brown, Roediger, McDaniel","linkingNoteSlug":"zYNgdfkzMAT6LuiN154ZoYC","contextBlocks":["By [[zTDVHBLRk1LKQ6G6bFHFoVZ:::Henry L. Roediger]] and others. Not really meant for me—a fairly shallow popular introduction to various phenomena in [[z5h4qfsMg1t1vC9EnfiAdK1:::Cognitive psychology]], with a heavy emphasis on [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]]. Illustrated with many uplifting anecdotes, per the norm for books of this type."],"hidden":true},{"linkingNoteTitle":"Agarwal, P. K., Karpicke, J. D., Kang, S. H. K., Roediger, H. L., \u0026 McDermott, K. B. (2008). Examining the testing effect with open- and closed-book tests. Applied Cognitive Psychology, 22(7), 861–876","linkingNoteSlug":"zXj6XXj1iJWsmHHKTCdNa1H","contextBlocks":["In two small-scale experiments on undergrads, open-book testing and closed-book testing (with feedback) achieve the same (substantial) [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]] on a test delayed one-week, relative to re-studying. This suggests that [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] interventions can possibly be made open-book without meaningful loss in efficacy."],"hidden":true},{"linkingNoteTitle":"Pooja Agarwal","linkingNoteSlug":"zX5XZn5xwaR74RXAa4gjDtV","contextBlocks":["Cognitive psychologist at WUStL with many papers on [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]]; also does science communications work evangelizing same."],"hidden":true},{"linkingNoteTitle":"Test-enhanced learning","linkingNoteSlug":"zEc2UJc674CYs8d4wPqNQEo","contextBlocks":["i.e. instructional design which intentionally exploits the [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]] to produce better learning outcomes, whether through [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] or higher-level problem-solving tests."],"hidden":true},{"linkingNoteTitle":"OpenStax","linkingNoteSlug":"zC67NCLihjvFdmX773Q95DV","contextBlocks":["Hm… it seems they’re doing experiments on [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]]! They’ve developed something called “[OpenStax Tutor](https://openstax.org/openstax-tutor)”, with support in 10 of their books."],"hidden":true},{"linkingNoteTitle":"Agarwal, P. (2019). Retrieval Practice \u0026 Bloom’s Taxonomy: Do Students Need Fact Knowledge Before Higher Order Learning? Journal of Educational Psychology, 111, 189–209","linkingNoteSlug":"zCAASkbEEbYcDdG49n1HKVi","contextBlocks":["Methodologically, this paper includes an interesting application of [[zFFTdRczpgGBy1P5QgeP635:::Bloom’s taxonomy]] to authoring [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] questions: it gives a scheme for creating retrieval practice questions for apply, analyze, evaluate, create."],"hidden":true},{"linkingNoteTitle":"Agarwal, P. K., Nunes, L. D., \u0026 Blunt, J. R. (2021). Retrieval Practice Consistently Benefits Student Learning: A Systematic Review of Applied Research in Schools and Classrooms. Educational Psychology Review.","linkingNoteSlug":"zV1xNteVY4otyHP5gCcanVN","contextBlocks":["A systematic review from [[zX5XZn5xwaR74RXAa4gjDtV:::Pooja Agarwal]] and colleagues examining “apples-to-apples” comparisons of [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] versus “business as usual” practice in classroom, typically lecture, but including any activities which don’t qualify as retrieval (including [[z2crTaHNqd6APCtmzXk7x6W:::Concept mapping]], see [[z3J3QxG3TkZfqkKWTx9cBvi:::Does concept mapping involve implicit retrieval practice?]]). Highly focused on single-measure quantitative outcomes. Covers 50 experiments across 37 publications."],"hidden":true},{"linkingNoteTitle":"Hartman, J. R., Nelson, E. A., \u0026 Kirschner, P. A. (2022). Improving student success in chemistry through cognitive science. Foundations of Chemistry, 24(2), 239–261","linkingNoteSlug":"zQaw87ErFw4uiJSWdRUbTYg","contextBlocks":["This is a nice review of the [[z5h4qfsMg1t1vC9EnfiAdK1:::Cognitive psychology]] literature around learning, as specifically applied to the challenges of learning chemistry. The central thesis is based on [[zKPm7dRfoX7TPXR9KvBCAeM:::Cognitive load theory]]; the recommendations are largely [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] oriented; the implication is that [[zS33ebqMsefTfnh8cwgHYFR:::Memory augmentation may make it easier to learn complex topics by decreasing working memory load]]."],"hidden":true},{"linkingNoteTitle":"Log: Quantum Country analysis","linkingNoteSlug":"z9bhN2NXqM4HYQQBtM1rMXX","contextBlocks":["Certainly suggests a causal downwards trend. What I take from this: [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], even when repeating the question until it’s remembered, does not fully compensate for forgetting. If you’re going to forget, it’s best to do the retrieval practice as soon as possible."],"hidden":true},{"linkingNoteTitle":"Marr’s levels of analysis","linkingNoteSlug":"zQnTUMfm4YPLyi8GFA1Ym1e","contextBlocks":["an **algorithmic** analysis might discern that based on a computational theory of the [[z4KScVkQCD2XmVwvSDUbZtn:::Spacing effect]] and [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]], a spaced study schedule would be a good procedure for learning"],"hidden":true},{"linkingNoteTitle":"Pyc, M. A., \u0026 Rawson, K. A. (2009). Testing the retrieval effort hypothesis: Does greater difficulty correctly recalling information lead to higher levels of memory? Journal of Memory and Language, 60(4), 437–447","linkingNoteSlug":"z5zckzyAM1DwEQqt94qMpsd","contextBlocks":["Experimental study demonstrating [[zYB7kwEFRu8QALcbzbcoy9T:::Desirable difficulties, after Bjork]] in the context of [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]]."],"hidden":true},{"linkingNoteTitle":"Roelle, J., \u0026 Berthold, K. (2017). Effects of incorporating retrieval into learning tasks: The complexity of the tasks matters. Learning and Instruction, 49, 142–156","linkingNoteSlug":"z2kS2Sj5WMfc3QqwoohbEGB","contextBlocks":["The authors demonstrate that making [[zSoTbuyrXFnDHibaSeEzPRx:::Adjunct questions]] function as [[zXA8c6XtMLgRCGwJFGnZUvw:::Retrieval practice]] (i.e. via closed-book testing) is a double-edged strategy: closed-book practice improves recall, but it also lowers immediate performance. When adjunct questions are complex, the impact on immediate performance is enough to produce an **inverted** [[zTpJdbe6ub7uhBFLuHkFsrT:::Testing effect]]. i.e: “a closed-book implementation style can substantially moderate the superiority of high complexity adjunct questions.” This is an interesting answer to [[z4jkVxd8nCgsfsz5mYGPU4z:::How complex should tasks be for test-enhanced learning?]]."],"hidden":true}],"linkedNoteSlugs":["zTpJdbe6ub7uhBFLuHkFsrT"],"ctimeMillis":1753115539775.2056,"mtimeMillis":1689272932846.539}}}}},"page":"/[note]","query":{"note":"zXA8c6XtMLgRCGwJFGnZUvw"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest
