lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Tacit knowledge</h1><p>Term originated by Michael Polanyi.</p><p>See e.g. <a href="/z5wZoGy72FafNGd1AHgtghs" class="jsx-1555031696 "><span>The Reflective Practitioner - Donald Schön</span></a>.</p><p>Often discussed together with <a href="/zL7XdosCZ9qeCSSCrhcYfwY" class="jsx-1555031696 "><span>Situated learning</span></a> and <a href="/zWceTLNTjH3DQ7iVpy38ocq" class="jsx-1555031696 "><span>Constructivism</span></a>.</p><h2>To read</h2><ul><li>ShadowBox</li></ul></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2024-04-01<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"Tacit_knowledge":{"data":{"slug":"Tacit_knowledge","title":"Tacit knowledge","contentMarkdown":"# Tacit knowledge\n\nTerm originated by Michael Polanyi.\n\nSee e.g. [[z5wZoGy72FafNGd1AHgtghs:::The Reflective Practitioner - Donald Schön]].\n\nOften discussed together with [[zL7XdosCZ9qeCSSCrhcYfwY:::Situated learning]] and [[zWceTLNTjH3DQ7iVpy38ocq:::Constructivism]].\n\n## To read\n\n*   ShadowBox\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Deschooling Society - Ivan Illich","linkingNoteSlug":"z3M21hHKkoGYbU3S8bcYBH3","contextBlocks":["Related: Illich writes, “For most widely shared skills, a person who demonstrates the skill is the only human resource we ever need or get.” This seems to work for [[zMdKRBZStQ4tCJJhomSYxvG:::Tacit knowledge]], albeit slowly and imperfectly. When and in what ways is more necessary?"],"hidden":true},{"linkingNoteTitle":"Cognitive apprenticeship","linkingNoteSlug":"zQgeXp15RWkzyiUv9WQsLtA","contextBlocks":["Concept proposed by Allan Collins, [[zFQ8beSWt5erQJnz8265Va2:::John Seely Brown]], and Susan Newman in the late 80’s. Heavily influenced by [[zL7XdosCZ9qeCSSCrhcYfwY:::Situated learning]], the authors propose to solve [[z7ffiDfqTR9pPcEEUUbCL7C:::Transfer learning]] and to help students acquire the [[zMdKRBZStQ4tCJJhomSYxvG:::Tacit knowledge]] involved in real practice by using techniques of [[z8aBPhjq7R6o8cwVNjzfDdr:::Apprenticeship]] in cognitive domains (math, reading, writing)."],"hidden":true},{"linkingNoteTitle":"The Reflective Practitioner - Donald Schön","linkingNoteSlug":"z5wZoGy72FafNGd1AHgtghs","contextBlocks":["Q. How does Schön’s understanding of professional expertise differ from the idea of [[zMdKRBZStQ4tCJJhomSYxvG:::Tacit knowledge]] introduced by Polanyi?"],"hidden":true},{"linkingNoteTitle":"Could streaming help convey tacit knowledge?","linkingNoteSlug":"z3kjeq9MUehXyKwhZn7EshT","contextBlocks":["Are the troubles of [[zMdKRBZStQ4tCJJhomSYxvG:::Tacit knowledge]] exacerbated in the streaming format, relative to real apprenticeship? One obvious difference is hi-fi interactivity. When I worked with more experienced designers, I’d pepper them with questions. Sometimes that’d make their instincts explicit."],"hidden":true},{"linkingNoteTitle":"Gary Klein","linkingNoteSlug":"zPYJQYKJ38X8VTLFmWFSpjf","contextBlocks":["Seeing What Others Don’t, naturalistic decision making, [[zMdKRBZStQ4tCJJhomSYxvG:::Tacit knowledge]]…"],"hidden":true},{"linkingNoteTitle":"Domains involving tacit knowledge often rely on apprenticeship","linkingNoteSlug":"z8rFWKYKJHryb89TGGG7V4F","contextBlocks":["You can learn lots of skills by watching YouTube explainer videos, or by reading a book. But it’s hard to learn how to be a good researcher or a good designer. And so on. One key reason seems to be that these domains involve a lot of [[zMdKRBZStQ4tCJJhomSYxvG:::Tacit knowledge]]. Such domains tend to have a strong tradition of apprenticeship or mentorship. And it’s often very difficult to learn the skills of the trade without that avenue."],"hidden":true},{"linkingNoteTitle":"Drosos, I., \u0026 Guo, P. J. (2021). Streamers Teaching Programming, Art, and Gaming: Cognitive Apprenticeship, Serendipitous Teachable Moments, and Tacit Expert Knowledge. 2021 IEEE Symposium on Visual Languages and Human-Centric Computing (VL/HCC), 1–6","linkingNoteSlug":"zAPeEKEdVqv6QoZdC2W189k","contextBlocks":["And a few barriers of [[zMdKRBZStQ4tCJJhomSYxvG:::Tacit knowledge]]:"],"hidden":true}],"linkedNoteSlugs":["z5wZoGy72FafNGd1AHgtghs","zL7XdosCZ9qeCSSCrhcYfwY","zWceTLNTjH3DQ7iVpy38ocq"],"ctimeMillis":1753115539824.9836,"mtimeMillis":1712001110478.679}}}}},"page":"/[note]","query":{"note":"Tacit_knowledge"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest.js" async=""></script></body></html>
