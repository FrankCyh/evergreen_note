lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Michael Bernstein</h1><p><a href="/Human-computer_interaction" class="jsx-1555031696 "><span>Human-computer interaction</span></a> professor at <a href="/z52Qf39TJLnmPfp7PwPFWaQ" class="jsx-1555031696 "><span>Stanford</span></a>. Focused on <a href="/zE1htR3r4baYXA2aj1zaq55" class="jsx-1555031696 "><span>CSCW</span></a>.</p><p>Had a nice “computer science research methods” class for undergrads (and maybe master’s students?): <a href="https://web.stanford.edu/class/cs197/">https://web.stanford.edu/class/cs197/</a></p></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zYXHHBJEno1egJr3A2vM52U":{"data":{"slug":"zYXHHBJEno1egJr3A2vM52U","title":"Michael Bernstein","contentMarkdown":"# Michael Bernstein\n\n[[Human-computer interaction]] professor at [[z52Qf39TJLnmPfp7PwPFWaQ:::Stanford]]. Focused on [[zE1htR3r4baYXA2aj1zaq55:::CSCW]].\n\nHad a nice “computer science research methods” class for undergrads (and maybe master’s students?): \u003chttps://web.stanford.edu/class/cs197/\u003e\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Michael Bernstein - CS 197 - Vectoring","linkingNoteSlug":"z2V5DSG69GLa71V6yRKV74C","contextBlocks":["Quite a bracing talk. [[zYXHHBJEno1egJr3A2vM52U:::Michael Bernstein]] suggests that a common problem for junior researchers is that they try to solve the whole problem they’re thinking about, or act on the idea they have, as if it’s a project spec—something to be implemented—rather than an undefined space to explore. This causes two problems: first, that you end up doing the wrong thing, because you go specific and answer-oriented before you really understand the idea; second, that you get stuck, because you’re trying to do too many things at once."],"hidden":true},{"linkingNoteTitle":"Michael Bernstein - CS 197 - Velocity","linkingNoteSlug":"zLg3XDQvfFpMT24tEe44s8Z","contextBlocks":["Continuing [[z2V5DSG69GLa71V6yRKV74C:::Michael Bernstein - CS 197 - Vectoring]], [[zYXHHBJEno1egJr3A2vM52U:::Michael Bernstein]] suggests that once you’ve figured out that most important question to answer, you must next make very rapid progress. You’re aiming for one-week cycles, ideally with multiple iterations in each cycle."],"hidden":true}],"linkedNoteSlugs":["Human-computer interaction","z52Qf39TJLnmPfp7PwPFWaQ","zE1htR3r4baYXA2aj1zaq55"],"ctimeMillis":1753115539682.379,"mtimeMillis":1689272742778.8}}}}},"page":"/[note]","query":{"note":"zYXHHBJEno1egJr3A2vM52U"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async="">
