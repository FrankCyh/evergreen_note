lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Note-writing system</h1><p>For more on my personal note-writing system, see <a href="/zR6RRbCfY5rFkiimFnaJZKB" class="jsx-1555031696 "><span>Evergreen note-writing as fundamental unit of knowledge work</span></a>.</p><ul><li><a href="/zJRmoVPc9vyv8QxSD5voijR" class="jsx-1555031696 "><span>Networked note-writing software</span></a></li></ul></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zGKtrhpZ3hS8bw8UGL8hMTP":{"data":{"slug":"zGKtrhpZ3hS8bw8UGL8hMTP","title":"Note-writing system","contentMarkdown":"# Note-writing system\n\nFor more on my personal note-writing system, see [[zR6RRbCfY5rFkiimFnaJZKB:::Evergreen note-writing as fundamental unit of knowledge work]].\n\n*   [[zJRmoVPc9vyv8QxSD5voijR:::Networked note-writing software]]\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Networked note-writing software","linkingNoteSlug":"zJRmoVPc9vyv8QxSD5voijR","contextBlocks":["[[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]] emphasizing links between parts of different documents"],"hidden":true},{"linkingNoteTitle":"The dominant culture around spaced repetition memory systems is fixated on meaningless goals","linkingNoteSlug":"z4ULp2KUgq3hBCJMWTUnLDX","contextBlocks":["You’ll also see people who try to remember every detail of everything they read (“just in case”), but without seriously engaging with the texts in any other way. One gets the sense that they’re terrified of ever “losing” anything (contra [[zQm6XAB3XXrXLHzF7gahpJ2:::Collecting material feels more useful than it usually is]]). This obsession drives much of the [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]] culture as well, stretching back to Ted Nelson."],"hidden":true},{"linkingNoteTitle":"My implementation of a personal mnemonic medium","linkingNoteSlug":"z6sX7ZcYdPiya3SzQ5segaq","contextBlocks":["I have implemented [[zWWh96dE6YZYmDCoo37977X:::The mnemonic medium can be extended to one’s personal notes]] in my own [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]]."],"hidden":true},{"linkingNoteTitle":"Mochi","linkingNoteSlug":"zMxXQHmTuLN9mKA46RPpqJs","contextBlocks":["[Mochi](https://mochi.cards) is a web-based Markdown-centric [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]] with an integrated [[z2D1qPwddPktBjpNuwYFVva:::Spaced repetition memory system]]."],"hidden":true},{"linkingNoteTitle":"RemNote","linkingNoteSlug":"zvZiz35n9aN8RJSEoa4yE5","contextBlocks":["[RemNote](https://www.remnote.io/homepage) is a web-based [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]] with a structured knowledge model and first-class operations for adapting notes into a [[z2D1qPwddPktBjpNuwYFVva:::Spaced repetition memory system]], a la [[zWWh96dE6YZYmDCoo37977X:::The mnemonic medium can be extended to one’s personal notes]]."],"hidden":true},{"linkingNoteTitle":"Release valves for non-linear thought may support improved linear output","linkingNoteSlug":"zDGk8tvVDD1mbTgpMMB5UGh","contextBlocks":["Likewise, in a [[zSzTnYqKsHgyS8ExW92gUpU:::Hypertext]] [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]], tangential thoughts can always be captured in another note and linked in: [[zSKD44o2VTbQuQYqmjupo4B:::Evergreen notes lower the emotional stakes in editing manuscripts]]. But this benefit isn’t necessarily about building up a well-connected ontology (as described in [[zF8xCU4BwXwbmSyp7tmff9i:::Evergreen notes should be densely linked]]); it’s more about maintaining hygiene and attention."],"hidden":true},{"linkingNoteTitle":"Taxonomy of note types","linkingNoteSlug":"zTDjZQbKAT9pALtsk2HfePx","contextBlocks":["stubs implicitly defined through backlinks ([[zL9q21MA7ygsKVfvn6FwBMq:::Backlinks can be used to implicitly define nodes in knowledge management systems]]); e.g. [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]], [[zG91aqpyGEiy8McMHAW7juq:::Audiobooks]]"],"hidden":true},{"linkingNoteTitle":"Collaborative knowledge management systems tend to decay","linkingNoteSlug":"zHcouiwcynak2Xu5wh8FbFj","contextBlocks":["It seems silly to have every team member taking their own notes on the papers they’re reading, on ideas they’re developing for team projects, on meetings, etc. The natural inclination is to build a team wiki or some similar collaborative [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]]. But those systems always seem to become unusable and unused."],"hidden":true},{"linkingNoteTitle":"Digital note-writing systems fixate on the presentation and manipulation of individual notes, mostly ignoring inter-note sense-making","linkingNoteSlug":"zsRuFxYgckGS81tr2eiBAP","contextBlocks":["In a digital [[zGKtrhpZ3hS8bw8UGL8hMTP:::Note-writing system]], by contrast, the environment’s focused on the experience of writing one note. The core operations and representations fixate on “the note you have open,” not on larger structures. In digital note-taking systems, I usually can’t simultaneously see the other note I’ve just finished writing—let alone the last four. Most systems barely support multiple windows, but even if I can open multiple windows, it’s awkward to arrange them into the spatial relationships I might naturally use for physical cards. Rather than peripheral vision, it’s like I’m wearing horse blinders and mittens."],"hidden":true}],"linkedNoteSlugs":["zR6RRbCfY5rFkiimFnaJZKB","zJRmoVPc9vyv8QxSD5voijR"],"ctimeMillis":1753115539714.6292,"mtimeMillis":1689272808577.359}}}}},"page":"/[note]","query":{"note":"zGKtrhpZ3hS8bw8UGL8hMTP"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"><
