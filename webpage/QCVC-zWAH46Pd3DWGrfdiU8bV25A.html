lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>QCVC</h1><p>The first essay of <a href="/zNVVrcxnkjk7pCabiBvaic1" class="jsx-1555031696 "><span>Quantum Country</span></a>.</p></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zWAH46Pd3DWGrfdiU8bV25A":{"data":{"slug":"zWAH46Pd3DWGrfdiU8bV25A","title":"QCVC","contentMarkdown":"# QCVC\n\nThe first essay of [[zNVVrcxnkjk7pCabiBvaic1:::Quantum Country]].\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"Spaced repetition memory prompts should be written to discourage shallow “pattern matching”","linkingNoteSlug":"zSiuztCZ594AZuCweRghcXT","contextBlocks":["For example, in [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]], there’s only one “who”-type question, i.e. one which asks for a person’s name. After a few repetitions, readers may learn that whenever they see a “who”-type question about quantum computing, the answer is John Preskill. But that shallow knowledge won’t serve them well in real creative work."],"hidden":true},{"linkingNoteTitle":"Quantum Country users rarely forget after demonstrating five-day retention","linkingNoteSlug":"z2Rv4RAjXUrwa3fMYn9Q1iR","contextBlocks":["For the 53 readers who have reviewed every [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] card for a full year following their first successful recall, the median (IQR) review count is 463 (436-507) and lapse count is 10 (22-38). So for most readers, less than 2% of repetitions constitute a lapse. That rises to 7% for 25th %ile readers. [[zJz1XCGaA8vnsFtuE9kRpAG:::20211126101825]]"],"hidden":true},{"linkingNoteTitle":"QCVC questions are initially forgotten at very different rates","linkingNoteSlug":"z2QUUpeEhCG3JoqesjdXnbW","contextBlocks":["[[z3i5JuKC4eezH7ynnQkdr3S:::Quantum Country users seem to forget most prompts quite slowly]], but that’s in large part because (it seems) a raft of particularly “easy” questions are masking larger rates of forgetting. [Here](https://docs.google.com/spreadsheets/d/1nsYOMdMQR2sT2aOPd65d6yxjdD8YoySTgPHcQFGGUnY/edit#gid=2077500863) are *per-card* [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] recall rates for the four conditions in [[zV8ipXAqmrgPxSzrSe19T98:::2021-04 Quantum Country schedule experiment]] ([[zTCv6vTQYUgWjMrcpJhxTbp:::20220112085959]]):"],"hidden":true},{"linkingNoteTitle":"Quantum Country users seem to forget most prompts quite slowly","linkingNoteSlug":"z3i5JuKC4eezH7ynnQkdr3S","contextBlocks":["For [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] prompts which were initially remembered, there’s very little forgetting ([[z6LGRqeGqeGjCLtgLQHz77A:::20211011120323]]):"],"hidden":true},{"linkingNoteTitle":"Quantum Country readers reliably develop detailed retention for embedded questions","linkingNoteSlug":"zRxhtQqHvLpatPLB4BvzMRB","contextBlocks":["All this data is among readers who answered 80%+ of [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] questions in the essay before their first review session."],"hidden":true},{"linkingNoteTitle":"Early 2021 proof of memory experiment on 1729","linkingNoteSlug":"z7HFVGjcRSb5fAEEnsJyqak","contextBlocks":["In April 2021, I launched a low-stakes “proof of memory” experiment with [[z2aivbS2NFosHESapexx7ZE:::Balaji Srinivasan]], [on his bounty-centric blog, 1729](https://1729.com/quantum-computing-and-proof-of-memory/), based on the ideas described in [[zQLzzf8VcSgTHn75yiEU7mJ:::The mnemonic medium can surface “proof of memory” social signals]]. We offered $10 each to 100 people who read [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] and collected all the prompts. Then we gave $100 to 10 people who actually kept up with the reviews for a month (defined as completing each review session within 72 hours after notification for a month)."],"hidden":true},{"linkingNoteTitle":"Does studying QCVC help readers understand the subsequent Search essay?","linkingNoteSlug":"zXkYGRQvJLYnh7PYeXsFiBf","contextBlocks":["I decided to compare readers who reached the in-text level in [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] before starting Search to readers who reached (at least) the 5-days level in QCVC before starting Search. I looked at their accuracy on the in-text questions while reading the Search essay."],"hidden":true},{"linkingNoteTitle":"Mnemonic essays may offer detailed retention of their contents in exchange for 35-50% reading time overhead","linkingNoteSlug":"z4biJ7i6da3exh3qmXXohjh","contextBlocks":["To reach an average of 2 months of demonstrated retention, 2019H1 [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] readers spent an average of 90 minutes reviewing. Because it takes the average reader about 4 hours to read the essay, we can frame the review time as a relative overhead: by spending 35-50% more time with the essay, readers will reliably retain all its details.","Just how small can we make that overhead? Looking at 2019H1 vs. 2019H2 [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] readers (the latter having a more aggressive schedule), it appears that we may have already reduced the cost by 25%."],"hidden":true},{"linkingNoteTitle":"The mnemonic medium’s design relies on light-weight prompts","linkingNoteSlug":"zCfJ4TfWWa24aKoRS7dpNc5","contextBlocks":["If readers are to remember all the key material from a mnemonic text, authors must include many prompts (e.g. [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] has 112 prompts and 20k words). As prompts become lighter-weight, readers will tolerate more of them at a given level of interest or time commitment. If each prompt takes 6s, we can add 112 prompts to QCVC at the cost of about 10 minutes—not so bad, since it takes most readers 3-4 hours to finish that essay."],"hidden":true},{"linkingNoteTitle":"I should consider asymmetric part-time collaborators","linkingNoteSlug":"z8Acd5zbstpRqjoHPgRKJW6","contextBlocks":["For example, [[Michael Nielsen]] and I started working on the [[zKPv6qkSErdRGqyryvgS2wS:::Mnemonic medium]] on these terms. He was working full time on writing the text of [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]], and I was just thinking about it on a couple evenings per week. We made a ton of creative progress. Though this is not an ideal example: I was in the critical path for actual execution work."],"hidden":true},{"linkingNoteTitle":"In-essay Quantum Country question difficulties partially predict first review difficulties","linkingNoteSlug":"zT5QDvCyXX3pqYkEDEtw2Ct","contextBlocks":["[[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] questions which many users forget in-essay tend to be forgotten in the first review session, and vice-versa, though R^2 is only ~0.5."],"hidden":true},{"linkingNoteTitle":"Quantum Country readers appear less likely to recover from forgetting when reviews are scheduled too late","linkingNoteSlug":"z5UfUeuEkvxPdAvMcpVPPew","contextBlocks":["*Epistemic status as of [[2021-11-22]]: sketchy, currently based only on initial reviews in [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]]*"],"hidden":true},{"linkingNoteTitle":"Log: Quantum Country analysis","linkingNoteSlug":"z9bhN2NXqM4HYQQBtM1rMXX","contextBlocks":["Let’s look across all [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]] cards. By repetition 4, the median card has 88% of readers trying for a month; 85% both try for a month and succeed. 60th %ile crosses 90% for the joint probability. The 20th %ile card has 70% of readers trying for a month; 66% both try and succeed. The 10th %ile card has joint probability of 56%. Not controlling reader pool very carefully here; N varies from 132 to 284 depending on card. I’ll tighten this down later. By fifth repetition, the median card has a 92% joint probability, and 40th %ile has 87%. [[zPdjyXArCijDmHWAvvux8Gs:::20220207125100]]"],"hidden":true},{"linkingNoteTitle":"Quantum Country’s questions don’t naturally correspond to text regions","linkingNoteSlug":"zMkSW7xPLf15xXPoFuFgCpa","contextBlocks":["On [[2021-07-14]] I worked through the first 47 of [[zWAH46Pd3DWGrfdiU8bV25A:::QCVC]]’s 112 questions (ending with `NB5XDC32OqTuhMVkUGZd`), trying to understand how well they’d apply in an alternative interface design in which prompts are associated with specific text spans, e.g. so that they can be picked up by pointing while reading, or so that they give some indication of what the author has designated as important."],"hidden":true}],"linkedNoteSlugs":["zNVVrcxnkjk7pCabiBvaic1"],"ctimeMillis":1753115539755.286,"mtimeMillis":1689272995753.353}}}}},"page":"/[note]","query":{"note":"zWAH46Pd3DWGrfdiU8bV25A"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest.js" async=""></script
