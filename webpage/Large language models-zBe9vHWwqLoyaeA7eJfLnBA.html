lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Large language models</h1></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"zBe9vHWwqLoyaeA7eJfLnBA":{"data":{"slug":"zBe9vHWwqLoyaeA7eJfLnBA","title":"Large language models","contentMarkdown":"# Large language models\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"AutoTutor","linkingNoteSlug":"z3iR6PS6S8PMjJ9i2Xj9on5","contextBlocks":["My sense is that the explicit systems around detecting and choosing conversational moves will mostly give way to prompt engineering in an era of [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]. AutoTutor implementations have mostly used pre-deep-learning strategies for modeling students; responses are mostly canned. Yet there are important structural insights captured in the tutoring methods specified by the architecture here. It’s interesting to consider how the tutoring insights represented by AutoTutor’s approach might be translated to a more versatile LLM-based implementation."],"hidden":true},{"linkingNoteTitle":"GPT-4","linkingNoteSlug":"zd4676MfH9HmGKhuneoHTZ","contextBlocks":["[[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] from [[zWBf9to9Ye3jBWqybfU1Q5w:::OpenAI]], released March 2023."],"hidden":true},{"linkingNoteTitle":"Application prompt variations are challenging to automate","linkingNoteSlug":"z3NDe3nR9hvqRqWWtvZdxe7","contextBlocks":["It probably *will* be valuable to notice the techniques we use as we generate application prompt variations, and to turn those into a kind of “playbook” for generating future variations; see e.g. [[z8d1Rq2d13fdQCjQiWzJybD:::A pattern language of prompt-writing]]. And maybe 2023-era [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] can help: [[zBcEii9Hf2Rv7vsUSB7pBoP:::GPT-3 can generate shallow variations of spaced repetition prompt questions]]."],"hidden":true},{"linkingNoteTitle":"GPT-3 can generate shallow variations of spaced repetition prompt questions","linkingNoteSlug":"zBcEii9Hf2Rv7vsUSB7pBoP","contextBlocks":["Rather than trying to generate full question/answer pairs, a much easier task for [[zBjh9jUahGSm7VpFtEjvKqT:::Using machine learning to generate good spaced repetition prompts from explanatory text]] is to use [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] to generate *variations* on question text, so that it’s phrased differently every time you see it, but reinforcing the same basic retrieval pattern. i.e. this is one way to automate [[z2HrihbnTYxjcu382ihWE9P:::Would spaced repetition memory systems perform better with varied question texts?]] and to accomplish [[zSiuztCZ594AZuCweRghcXT:::Spaced repetition memory prompts should be written to discourage shallow “pattern matching”]]."],"hidden":true},{"linkingNoteTitle":"Idea-centric memory system","linkingNoteSlug":"z7wCFe7MP9VeCVApcBLC7SN","contextBlocks":["In the case of the [[zKPv6qkSErdRGqyryvgS2wS:::Mnemonic medium]], this might mean a static library of activities or activity templates provided by the author. In the case of a more general system, this task probably requires some kind of generative AI (i.e. [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]); see [[zBjh9jUahGSm7VpFtEjvKqT:::Using machine learning to generate good spaced repetition prompts from explanatory text]]. Challenges abound there.","… which may approach straightforward natural language, given [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]"],"hidden":true},{"linkingNoteTitle":"What is my personal moral responsibility with respect to AI risk?","linkingNoteSlug":"z786fRYHHBV9sjFrSQ8eD5b","contextBlocks":["I’m tremendously excited about the prospects of powerful AI systems for humanity. If we get them right, we’ll have wildly expanded our capacity. We’ll become unrecognizable. But these systems also have the potential to do unbelievable amounts of harm. That doesn’t necessarily mean that we should never create such systems. I want to see AGI in my lifetime. But I also want to not live through debilitating catastrophe. What has me quite concerned at the moment is that these models’ capacities are growing at a pace which far outstrips our abilities to confidently contend with their significant potential harms. I’m really thinking about [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] in particular here."],"hidden":true},{"linkingNoteTitle":"Bowman, S. R. (2023). Eight Things to Know about Large Language Models","linkingNoteSlug":"z7jNwtTKn3T5q2CMu749jpW","contextBlocks":["A nice overview, from a technical perspective, of some empirical properties of [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] which might be relevant to discussions of [[zJTdFxHeAbY5qUNcdtAohrJ:::AI risk]]."],"hidden":true},{"linkingNoteTitle":"GPT-4 can probably estimate whether two flashcards are functionally equivalent","linkingNoteSlug":"zJ7PMGzjcgBUoPjLUHBF9jn","contextBlocks":["In my simple tests so far, it seems that [[zd4676MfH9HmGKhuneoHTZ:::GPT-4]] could be used to assess [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]-generated prompts versus a human benchmark (i.e. for [[zBjh9jUahGSm7VpFtEjvKqT:::Using machine learning to generate good spaced repetition prompts from explanatory text]])."],"hidden":true},{"linkingNoteTitle":"Retrieval-augmented generation","linkingNoteSlug":"z3ch6F4sqmJbBnqHRScEGNr","contextBlocks":["More or less a workaround for the context window limitations of today’s [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]: given the context of the conversation, fetch the most relevant information (from a too-large set of tokens) and supply it along with the request."],"hidden":true},{"linkingNoteTitle":"Reading comprehension questions can uncover textbase holes","linkingNoteSlug":"zLZUS7KTrG4ABm3tRLGxMMj","contextBlocks":["I was embarrassed to find ([[2023-09-11]]) that when I asked [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] to generate reading comprehension questions to help me assess the textbase (see [[zHTLU2rAxAo8i1xBGVQPPcr:::Construction-integration model]]) I’d constructed for a section in [[Linear Algebra - Hefferon]], several of the questions revealed sections of the text that I hadn’t processed at all. Even though I was trying to read somewhat carefully."],"hidden":true},{"linkingNoteTitle":"LLaMa","linkingNoteSlug":"zJVL2EaAnPYiaMdJ17rjvtu","contextBlocks":["A [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] trained by [[zLgcAJuipRnXzF3bwHLsZAU:::FAIR]] and released in early 2023. Model weights leaked almost immediately."],"hidden":true},{"linkingNoteTitle":"Chain-of-thought reasoning","linkingNoteSlug":"z4wArCCX2McNMcxRTWKgSzH","contextBlocks":["A technique for prompting [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]: ask them to “think step by step” (or similar) and to emit a line of reasoning before producing the desired output. This often improves performance, sometimes quite substantially."],"hidden":true},{"linkingNoteTitle":"Reason+Act pattern","linkingNoteSlug":"zBzzyxdsc9WbM8NrdPtgDuK","contextBlocks":["This method gives [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] the ability to take action in the world by providing them with a set of tools they can elect to deploy by emitting appropriate special tokens in their output. For example, a language model can be given a four-function calculator, or the ability to query Wikipedia."],"hidden":true},{"linkingNoteTitle":"It’s hard to maintain design artifacts across different levels of fidelity","linkingNoteSlug":"zQnC2TAkng7HtDYgqmpqKqQ","contextBlocks":["Another approach might be to lighten the burden involved in creating each of these stages from the last. It’s enough of a hassle to make a conceptual model or wireframe that designers often don’t bother—even though it’s “good for them.” For instance, [[Taylor Rogalski]] prototyped a [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] prompt which generates a conceptual model (in [[z3JSXAyTsK4XGWX8hbWEhsB:::Mermaid]]) from a high-level textual description of a program. The machine doesn’t need to get it totally right, so long as the provisional model is fludily editable by the designer afterwards. (see [[zYNAcyhCgCn1tR6wMy4jrtE:::Heer, J. (2019). Agency plus automation: Designing artificial intelligence into interactive systems. Proceedings of the National Academy of Sciences, 116(6), 1844–1850]])."],"hidden":true},{"linkingNoteTitle":"Ought","linkingNoteSlug":"zGiQ29ertSdiFWhHXXURWSh","contextBlocks":["Non-profit research lab exploring how [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] might augment cognition, particularly around scientific research and especially problems of AI alignment."],"hidden":true},{"linkingNoteTitle":"Reif, E., Ippolito, D., Yuan, A., Coenen, A., Callison-Burch, C., \u0026 Wei, J. (2021). A Recipe For Arbitrary Text Style Transfer with Large Language Models.","linkingNoteSlug":"zTLdDEMqLYjr38pVsfaXwnf","contextBlocks":["Surprisingly general performance for arbitrary style transfer tasks in [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]!"],"hidden":true},{"linkingNoteTitle":"Sorcerer (tutor)","linkingNoteSlug":"zUTU3FRj6pA1new7x9R3tne","contextBlocks":["A tutor built with [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]]."],"hidden":true},{"linkingNoteTitle":"Weidinger, L., Mellor, J., Rauh, M., Griffin, C., Uesato, J., Huang, P.-S., Cheng, M., Glaese, M., Balle, B., Kasirzadeh, A., Kenton, Z., Brown, S., Hawkins, W., Stepleton, T., Biles, C., Birhane, A., Haas, J., Rimell, L., Hendricks, L. A., … Gabriel, I. (2021). Ethical and social risks of harm from Language Models (arXiv:2112.04359). arXiv","linkingNoteSlug":"zCiaVt5aUKXeJdVJavESWRU","contextBlocks":["Survey paper cataloging potential risks from [[zBe9vHWwqLoyaeA7eJfLnBA:::Large language models]] and characterizing them by their origins."],"hidden":true}],"linkedNoteSlugs":[],"ctimeMillis":1753115539650.846,"mtimeMillis":1689273029822.6318}}}}},"page":"/[note]","query":{"note":"zBe9vHWwqLoyaeA7eJfLnBA"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest.js" async=""></script></body></html>
