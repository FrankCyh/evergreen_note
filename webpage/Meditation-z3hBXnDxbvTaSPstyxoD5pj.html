lass="jsx-3179990917 PresentedNote"><div class="jsx-2479918432 NoteContainer"><div class="jsx-2479918432 PrimaryNote"><div class="jsx-732926425"><div class="MarkdownContainer"><h1>Meditation</h1></div></div><div class="jsx-2479918432 FooterMeta">Last updated <!-- -->2023-07-13<!-- -->.</div></div></div></div></div></div></div></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialNoteCache":{"z3hBXnDxbvTaSPstyxoD5pj":{"data":{"slug":"z3hBXnDxbvTaSPstyxoD5pj","title":"Meditation","contentMarkdown":"# Meditation\n\n\n\n\n\n\n","backlinkedNotes":[{"linkingNoteTitle":"The Mind Illuminated - Culadasa","linkingNoteSlug":"z8dXowKop2xGp9UEVwXpG2Q","contextBlocks":["Excellent text on [[z4hwx4AGNYVhfMfxsRE6WeZ:::Samadhi]]-oriented [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]]."],"hidden":true},{"linkingNoteTitle":"Guided meditation app","linkingNoteSlug":"z4exmF6rnZTE9GjCnpFBKUT","contextBlocks":["Interactive daily [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] courses encompassing both tools and curricular material—e.g. Headspace, Waking Up, etc."],"hidden":true},{"linkingNoteTitle":"Guided meditation apps deliver enacted experiences in a mass medium","linkingNoteSlug":"zN7KLBKWMTmFqthmFPVSNbP","contextBlocks":["If you download a [[z4exmF6rnZTE9GjCnpFBKUT:::Guided meditation app]] and stick with its daily sessions for a few months, you’ll likely have some surprising and profound experiences. Unlike a typical course, though, any profound discoveries you experience will feel largely self-authored, despite the presence of a teacher. You’re not going to learn by waiting for the [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] teacher to “make you enlightened”: you have to put in the time on the cushion, receptive to your own sensations. All that said, while these experiences might feel self-authored,  meditation lessons are in fact structured to bring them about. This makes meditation lessons an interesting example of an [[z92TGMiBsnraf5KXxSTNkBJ:::Enacted experience]]."],"hidden":true},{"linkingNoteTitle":"Dullness","linkingNoteSlug":"zVNTDbWaVNxgTSPx3cNLDPc","contextBlocks":["Buddhism offers an interesting model of mental acuity. It suggests that a key challenge to progressing in [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] is “dullness,” (“laya” in Sanskrit) characterized by weak attention, “like trying to see through a dense fog.” It becomes an obstacle during longer meditation sessions because the mind is used to a certain amount of stimulation to occupy its attention, and that’s not supplied during meditation."],"hidden":true},{"linkingNoteTitle":"Samadhi","linkingNoteSlug":"z4hwx4AGNYVhfMfxsRE6WeZ","contextBlocks":["In the Theravada tradition, *samadhi* refers to continuous attention on a specific [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] object."],"hidden":true},{"linkingNoteTitle":"Guided meditation apps are naturally spread over time","linkingNoteSlug":"zSNDTj75ULnYMo7pGm2Frg7","contextBlocks":["[[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]]’s insights unfold slowly. Aspirants are typically advised to practice daily. Over weeks and months, they may begin to experience the world differently. Some concepts in meditation won’t make any sense if you’re still having trouble clearly perceiving your breath—so they’re better introduced somewhat later. Other concepts must be introduced many times, in many different framings, before the moment is finally right."],"hidden":true},{"linkingNoteTitle":"Guided meditation apps bundle instruction with daily sessions","linkingNoteSlug":"zC4sWYDcheVSeCxpQPA9w88","contextBlocks":["When I sit down to [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] with a [[z4exmF6rnZTE9GjCnpFBKUT:::Guided meditation app]], I don’t think of myself as “taking a lesson” or even really “receiving instruction.” I’m sitting down *to meditate.* But in fact, those sessions are lessons, and I do receive instruction. I use an app to guide my meditation session. These apps generally open each day’s session with a brief lesson that frames the day’s practice. Then throughout the session, the teacher will offer intermittent pointers, relating to that day’s theme. After the session, the lesson will often close with a few parting sentences."],"hidden":true},{"linkingNoteTitle":"Dullness and distraction in creative work may arise from the same causes as in meditation","linkingNoteSlug":"zG8RB9kAnBBzZ8fpfGh8Drp","contextBlocks":["It sounds obvious in retrospect: [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] instructors say all the time that the point is not to achieve attention and awareness just while in explicit meditation sessions, but to bring that same quality of mind to everyday life. I’d understood that in terms of recognizing [[zW4ibrYmQAq5tTY4JEsGcDX:::Impermanence]] and [[z5URdYxJwnM5TVhQnbZER8b:::Non-identification]]. But somehow I hadn’t connected that to problems I encounter when doing difficult creative work."],"hidden":true},{"linkingNoteTitle":"The high-order bit for my productivity is whether I complete a deeply-focused morning creative block","linkingNoteSlug":"z2q7U5ZvXeDxXD6vXAbZb9a","contextBlocks":["[[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] certainly helps here: [[zG8RB9kAnBBzZ8fpfGh8Drp:::Dullness and distraction in creative work may arise from the same causes as in meditation]]. The key does seem to be continuous metacognitive awareness. It also helps to [[z5zoV8TdSds59vQEkqp3JEz:::Get curious]] and [[zQ48c3CqTAtpJJ2itF7Uu85:::Get playful]]. And part of it, I observe, is just practice. I spent many years doing quite task-oriented work. The project of moving into increasingly challenging creative work is in part the project of getting comfortable being lost, and still making progress while remaining lost. [[zGeqdWaGnGqP86hZBTUvTBm:::Deep research requires a slower pace than tech industry work]]"],"hidden":true},{"linkingNoteTitle":"Vipassana","linkingNoteSlug":"z4CkjiFVBwMqfLRdLeXRB1V","contextBlocks":["A style of [[z3hBXnDxbvTaSPstyxoD5pj:::Meditation]] focused on “insight”, direct perception, “awake awareness”, [[z5URdYxJwnM5TVhQnbZER8b:::Non-identification]]."],"hidden":true}],"linkedNoteSlugs":[],"ctimeMillis":1753115539676.6467,"mtimeMillis":1689272673530.9739}}}}},"page":"/[note]","query":{"note":"z3hBXnDxbvTaSPstyxoD5pj"},"buildId":"d3AhszHS2XKFxCZtCz_mu"}</script><script nomodule="" src="/_next/static/runtime/polyfills-e8011738b1ac3730e620.js"></script><script async="" data-next-page="/[note]" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/%5Bnote%5D.js"></script><script async="" data-next-page="/_app" src="/_next/static/d3AhszHS2XKFxCZtCz_mu/pages/_app.js"></script><script src="/_next/static/runtime/webpack-9a1dc14bbed04abf6704.js" async=""></script><script src="/_next/static/chunks/framework.74d547792b3163b4d6d2.js" async=""></script><script src="/_next/static/chunks/commons.c2974388a2462b28b6b5.js" async=""></script><script src="/_next/static/runtime/main-5d5a51c312deca4d894c.js" async=""></script><script src="/_next/static/chunks/484bcb1e.441d7edb435a1dc61bf0.js" async=""></script><script src="/_next/static/chunks/ff239f9d.a7e0183771fec2399e58.js" async=""></script><script src="/_next/static/chunks/0938bdecdc379ead52a6327579ade583c01e0c8c.4bfc644b2614f83f6757.js" async=""></script><script src="/_next/static/chunks/2177072ad3b33e7a9ea5a8269738276f63cb507b.1859c8fa67d80d520a99.js" async=""></script><script src="/_next/static/chunks/47ecb806e3e12e23cc348937acd30f69440b02a6.d84cad56b7e7bd3d0c3c.js" async=""></script><script src="/_next/static/chunks/styles.741b6c7f778422f18e01.js" async=""></script><script src="/_next/static/d3AhszHS2XKFxCZtCz_mu/_buildManifest.js" async=""></script></body></html>
